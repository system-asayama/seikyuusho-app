<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}請求書アプリ{% endblock %}</title>
  <style>
    :root { --bg:#f4f6fb; --card:#fff; --primary:#2b6cb0; --danger:#e03131; --warn:#e67700;
            --text:#222; --muted:#777; --border:#d0d4dd; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
           background:var(--bg); color:var(--text); }
    header { background:var(--primary); color:#fff; padding:12px 20px;
             display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
    header a, header button.linklike { color:#fff; text-decoration:none; margin-left:16px; font-size:15px; }
    header .brand { font-weight:700; font-size:18px; }
    header nav { display:flex; align-items:center; flex-wrap:wrap; }
    header form { display:inline; margin:0; }
    button.linklike { background:none; border:none; padding:0; cursor:pointer; margin-top:0; }
    .container { max-width:960px; margin:32px auto; padding:0 16px; }
    .card { background:var(--card); border-radius:12px; padding:24px;
            box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:20px; }
    .card.narrow { max-width:400px; margin-left:auto; margin-right:auto; }
    h1 { margin-top:0; font-size:22px; }
    label { display:block; margin:12px 0 4px; font-size:14px; color:var(--muted); }
    input, select { width:100%; padding:10px; border:1px solid var(--border);
                    border-radius:8px; font-size:15px; background:#fff; }
    button { cursor:pointer; border:none; border-radius:8px; padding:10px 16px;
             font-size:15px; background:var(--primary); color:#fff; margin-top:16px; }
    button.danger { background:var(--danger); }
    button.warn { background:var(--warn); }
    button.secondary { background:#868e96; }
    button.small { padding:6px 10px; font-size:13px; margin-top:0; }
    .muted { color:var(--muted); font-size:14px; }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:12px; font-size:14px; }
    .flash.success { background:#e6fcf5; color:#0c8599; }
    .flash.error { background:#fff0f0; color:#c92a2a; }
    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid #eee; font-size:14px;
             white-space:nowrap; vertical-align:middle; }
    th.wrap, td.wrap { white-space:normal; }
    tr.inactive td { opacity:.55; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
    .badge.admin { background:#fff3bf; color:#a06b00; }
    .badge.user { background:#e7f5ff; color:#1971c2; }
    .badge.off { background:#f1f3f5; color:#868e96; }
    .inline { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .inline form { display:flex; gap:6px; align-items:center; margin:0; }
    .inline input, .inline select { width:auto; padding:6px 8px; font-size:13px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:0 16px; }
    a.link { color:var(--primary); }
  </style>
</head>
<body>
  <header>
    <span class="brand">🧾 請求書アプリ</span>
    <nav>
      {% if current_user %}
        <a href="{{ url_for('dashboard') }}">ダッシュボード</a>
        {% if current_user.is_admin %}<a href="{{ url_for('admin_users') }}">ユーザー管理</a>{% endif %}
        <a href="{{ url_for('settings') }}">アカウント設定</a>
        <form method="post" action="{{ url_for('logout') }}">
          <button type="submit" class="linklike">ログアウト（{{ current_user.name }}）</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
